name: Comprimir Archivos de Texto (Auto-Huffman)

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.txt' # Solo se ejecuta si hay cambios en archivos de texto

jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requerido para poder hacer commit en la rama del PR
    
    steps:
      - name: 📥 Descargar Repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }} # Hace checkout a la rama donde se originó el PR

      - name: 🔍 Obtener Archivos TXT Modificados
        id: changed-files
        uses: tj-actions/changed-files@v42
        with:
          files: '**/*.txt'

      - name: 🛠️ Compilar el Compresor en C
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          cd Code
          mkdir -p build
          gcc src/app.c src/compresor.c src/descompresor.c src/tree_huffman.c src/bitwise.c -o build/compresor_app

      - name: 🐍 Configurar Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🚀 Ejecutar Script de Compresión
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Pasamos la lista de archivos TXT modificados al script
          python script_compresor.py ${{ steps.changed-files.outputs.all_changed_files }}

      - name: 💾 Subir Archivos Comprimidos a GitHub (Auto Commit)
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-compresión de archivos .txt a .bin (GitHub Actions)"
          file_pattern: "**/*.bin"
